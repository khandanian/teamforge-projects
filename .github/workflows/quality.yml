name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check assets/app.js && node --check tests/smoke.test.cjs && node --check tests/behavior.test.cjs
      - name: Run smoke tests
        run: node --test tests/smoke.test.cjs tests/behavior.test.cjs
